name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download speech engine, Persian voices and PDF reader library
        run: |
          set -e
          mkdir -p app/libs app/src/main/assets/tts app/src/main/assets/www

          # Speech engine (sherpa-onnx)
          curl -L --fail -o app/libs/sherpa-onnx-1.11.4.aar \
            "https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.11.4.aar"

          # Persian voices (Piper models packaged for sherpa-onnx)
          for v in amir ganji_adabi; do
            curl -L --fail -o voice.tar.bz2 \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fa_IR-${v}-medium.tar.bz2"
            tar xf voice.tar.bz2
            d="vits-piper-fa_IR-${v}-medium"
            mkdir -p "app/src/main/assets/tts/${v}"
            cp ${d}/*.onnx "app/src/main/assets/tts/${v}/model.onnx"
            cp ${d}/tokens.txt "app/src/main/assets/tts/${v}/tokens.txt"
            if [ ! -d app/src/main/assets/tts/espeak-ng-data ]; then
              cp -r ${d}/espeak-ng-data app/src/main/assets/tts/espeak-ng-data
            fi
            rm -rf "${d}" voice.tar.bz2
          done

          # PDF reader library (pdf.js)
          curl -L --fail -o app/src/main/assets/www/pdf.min.js \
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
          curl -L --fail -o app/src/main/assets/www/pdf.worker.min.js \
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"

          ls -R app/src/main/assets | head -50
          ls -la app/libs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: ketabkhoon-apk
          path: app/build/outputs/apk/debug/app-debug.apk
